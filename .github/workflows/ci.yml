name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: fwilhe2/setup-kotlin@main
      - run: sudo apt-get install -y -qq fonts-dejavu-core
      - run: sh build.sh
      - run: sh test.sh
      - name: render the example page
        run: |
          java -jar build/kotbrowse.jar examples/index.html -o page.png --dump --text
          test -s page.png
      - uses: actions/upload-artifact@v4
        with:
          name: rendered-page
          path: page.png
